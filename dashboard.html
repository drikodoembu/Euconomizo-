<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Euconomizo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f5f5f5; }

.topo {
  background:#2E7D32;
  color:white;
  padding:20px;
  text-align:center;
}

.container { padding:15px; }

.card {
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#4CAF50;
  color:white;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

.item {
  border-bottom:1px solid #eee;
  padding:10px 0;
}
</style>
</head>

<body>

<div class="topo">
  <h2>Euconomizo</h2>
  <p id="userInfo"></p>
</div>

<div class="container">

<div class="card">
Saldo: R$ <b id="saldo">0</b><br>
Ganhos: R$ <b id="ganhos">0</b><br>
Gastos: R$ <b id="gastos">0</b>
</div>

<div class="card">
<h3>Novo lançamento</h3>

<select id="tipo">
  <option value="ganho">Ganho</option>
  <option value="gasto">Gasto</option>
</select>

<input id="nome" placeholder="Nome">
<input id="valor" type="number" placeholder="Valor">

<select id="categoria"></select>

<input id="data" type="date">

<button onclick="salvar()">Salvar</button>
</div>

<div class="card">
<h3>Histórico</h3>
<div id="lista"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCElTa77Q7PiEgsMadbxDxZvxC-QE1P-ks",
  authDomain: "euconomizo-ebc13.firebaseapp.com",
  projectId: "euconomizo-ebc13",
  storageBucket: "euconomizo-ebc13.firebasestorage.app",
  messagingSenderId: "184248751974",
  appId: "1:184248751974:web:43edb4192a766a2a019aa7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// PERFIL SIMPLES
let perfil = JSON.parse(localStorage.getItem("perfil"));

if (!perfil) {
  const nome = prompt("Seu nome:");
  const papel = prompt("Marido ou Esposa?");
  const cor = prompt("Cor (blue, purple, green)");

  perfil = { nome, papel, cor };
  localStorage.setItem("perfil", JSON.stringify(perfil));
}

document.getElementById("userInfo").innerHTML =
  `<span style="color:${perfil.cor}">${perfil.nome} (${perfil.papel})</span>`;

const categoriasGanhos = ["Salário","Extra","Venda","Outros"];
const categoriasGastos = ["Alimentação","Moradia","Lazer","Contas","Outros"];

function atualizarCategorias(){
  const tipo = document.getElementById("tipo").value;
  const cat = document.getElementById("categoria");

  cat.innerHTML = "";

  const lista = tipo==="ganho"?categoriasGanhos:categoriasGastos;

  lista.forEach(c=>{
    const op = document.createElement("option");
    op.value=c;
    op.textContent=c;
    cat.appendChild(op);
  });
}

window.salvar = async function(){

  const tipo = document.getElementById("tipo").value;
  const nome = document.getElementById("nome").value;
  const valor = parseFloat(document.getElementById("valor").value);
  const categoria = document.getElementById("categoria").value;
  const data = document.getElementById("data").value;

  if(!nome || !valor) return alert("Preencha tudo");

  await addDoc(collection(db,"lancamentos"),{
    tipo,nome,valor,categoria,data,
    usuario:perfil.nome,
    cor:perfil.cor
  });

  carregar();
};

window.excluir = async function(id){
  await deleteDoc(doc(db,"lancamentos",id));
  carregar();
};

window.editar = async function(id,n,v){
  const nome = prompt("Nome:",n);
  const valor = prompt("Valor:",v);

  await updateDoc(doc(db,"lancamentos",id),{
    nome,valor:parseFloat(valor)
  });

  carregar();
};

async function carregar(){

  let ganhos=0,gastos=0;
  const lista = document.getElementById("lista");
  lista.innerHTML="";

  const snap = await getDocs(collection(db,"lancamentos"));

  snap.forEach(d=>{
    const item = d.data();

    if(item.tipo==="ganho") ganhos+=item.valor;
    else gastos+=item.valor;

    lista.innerHTML+=`
    <div class="item">
      <b>${item.nome}</b> - ${item.tipo} - R$ ${item.valor}<br>
      <span style="color:${item.cor}">${item.usuario}</span><br>
      <button onclick="editar('${d.id}','${item.nome}',${item.valor})">Editar</button>
      <button onclick="excluir('${d.id}')">Excluir</button>
    </div>
    `;
  });

  document.getElementById("ganhos").innerText=ganhos.toFixed(2);
  document.getElementById("gastos").innerText=gastos.toFixed(2);
  document.getElementById("saldo").innerText=(ganhos-gastos).toFixed(2);
}

onAuthStateChanged(auth,(user)=>{
  if(!user) window.location.href="index.html";
  atualizarCategorias();
  carregar();
});

</script>

</body>
</html>
