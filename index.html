<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCElTa77Q7PiEgsMadbxDxZvxC-QE1P-ks",
    authDomain: "euconomizo-ebc13.firebaseapp.com",
    projectId: "euconomizo-ebc13",
    storageBucket: "euconomizo-ebc13.firebasestorage.app",
    messagingSenderId: "184248751974",
    appId: "1:184248751974:web:43edb4192a766a2a019aa7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = async function () {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {
      await signInWithEmailAndPassword(auth, email, senha);
      alert("Login realizado com sucesso 🚀");
      window.location.href = "dashboard.html";
    } catch (error) {
      alert(error.message);
    }
  };

  window.cadastrar = async function () {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {
      await createUserWithEmailAndPassword(auth, email, senha);
      alert("Conta criada com sucesso 🎉");
    } catch (error) {
      alert(error.message);
    }
  };
</script>
