<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Euconomizo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #1b5e20, #4CAF50);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    h2 {
      color: #2E7D32;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #4CAF50;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Euconomizo</h2>
  <p>Controle financeiro do casal 💚</p>

  <input type="email" id="email" placeholder="Seu e-mail">
  <input type="password" id="senha" placeholder="Sua senha">

  <button onclick="criarConta()">Criar conta</button>
  <button onclick="login()">Entrar</button>

  <p style="margin-top:15px;">Organize suas finanças juntos 🚀</p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCElTa77Q7PiEgsMadbxDxZvxC-QE1P-ks",
  authDomain: "euconomizo-ebc13.firebaseapp.com",
  projectId: "euconomizo-ebc13",
  storageBucket: "euconomizo-ebc13.firebasestorage.app",
  messagingSenderId: "184248751974",
  appId: "1:184248751974:web:43edb4192a766a2a019aa7"
};

// INICIALIZA
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// CRIAR CONTA
window.criarConta = async function () {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    await createUserWithEmailAndPassword(auth, email, senha);
    alert("Conta criada com sucesso!");
  } catch (erro) {
    alert("Erro: " + erro.message);
  }
};

// LOGIN
window.login = async function () {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    await signInWithEmailAndPassword(auth, email, senha);
    alert("Login realizado com sucesso!");

    // 🔥 ESSA LINHA É O SEGREDO
    window.location.href = "dashboard.html";

  } catch (erro) {
    alert("Erro: " + erro.message);
  }
};

</script>

</body>
</html>
